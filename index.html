<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUDSON V1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <header>
            <h2>HUDSON - Minha inteligência Artificial própria</h2>
            <p id="status">Aguardando inicialização...</p>
        </header>
        
        <div class="chat-box" id="chat-box">
            <div class="message ai-message">
                Olá! Sou sua IA local. Aguarde meu carregamento para conversarmos.
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Digite sua mensagem..." disabled>
            <button id="send-btn" disabled>Enviar</button>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
